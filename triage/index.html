<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MarginLabs — Apply for funding</title>
<meta name="description" content="Apply for business funding in 90 seconds. Answer in simple bands — no documents, no login. We'll come back by email with your next step." />
<link rel="icon" href="../marginlabs-favicon.svg" type="image/svg+xml" />
<style>
  /* ML-TOKENS:BEGIN — generated from brand/tokens.css by
     scripts/sync-tokens.py. Do not edit here; edit that file and re-run it. */
  :root {
    /* --- surfaces ------------------------------------------------------- */
    /* True neutrals, not green-tinted. The tint was what made every screen feel
       faintly coloured before anything meaningful was on it. */
    --ml-surface:        #FFFFFF;   /* cards, raised panels, the thing you read on */
    --ml-surface-sunk:   #F5F5F5;   /* page ground, inset wells */
    --ml-surface-alt:    #FAFAFA;   /* secondary fill, hover, zebra rows */

    /* --- text ------------------------------------------------------------ */
    --ml-text:           #0A0A0A;   /* primary */
    --ml-text-soft:      #171717;   /* emphasis inside body copy */
    /* The step that was missing. Secondary text had nowhere to sit between #171717
       and #737373, so it ended up on #737373 — 4.7:1, a hair over the AA floor of
       4.5, and it showed. This is 7.8:1, matching the 8.0:1 the product had before
       the density pass. Secondary body copy belongs here, not on --ml-text-muted. */
    --ml-text-body:      #525252;   /* secondary body copy — 7.8:1 on white */
    --ml-text-muted:     #737373;   /* labels, captions, metadata — tertiary only */
    --ml-text-faint:     #A3A3A3;   /* placeholder, disabled */
    --ml-text-on-dark:   #FFFFFF;   /* text sitting on ink or brand fills */

    /* --- lines ----------------------------------------------------------- */
    --ml-line:           #E5E5E5;   /* default border */
    --ml-line-soft:      #F0F0F0;   /* internal dividers */
    --ml-line-strong:    #D4D4D4;   /* emphasis, form outlines */
    --ml-track:          #E5E5E5;   /* progress / meter troughs */

    /* --- action vs identity vs meaning -----------------------------------
       These were ONE green doing three jobs, which is why a green tick and a
       green button were indistinguishable. Now:
         --ml-action  the thing you click. Achromatic, so it never competes.
         --ml-mark    the identity green. The logo, and nothing else by default.
         --ml-good    "we have this / it is done". The only green on a working
                      screen, which is what makes it readable at a glance. */
    --ml-action:         #171717;
    --ml-action-hover:   #0A0A0A;
    --ml-action-soft:    #FAFAFA;
    --ml-action-line:    #E5E5E5;
    --ml-mark:           #2F7D58;

    /* --- semantic -------------------------------------------------------- */
    /* These take the values the product ALREADY uses most, rather than importing
       the reference's. #B14431 appears in 51 console rules and in both dashboard
       ramps; #B45309 in 41. Adopting them unifies console, dashboards, portal and
       website on one red and one amber in a single line each, instead of a
       51-site find-and-replace through matched hex + rgba() + soft-fill sets. */
    --ml-good:           #2F7D58;
    --ml-warn:           #B45309;
    --ml-bad:            #B14431;
    --ml-good-soft:      #F0F7F3;
    /* #FAF1DF put warn text at 4.47:1 — the only one of the three semantic pills
       under AA, while good sat at 4.60 and bad at 4.76. Lightened so the amber
       pill matches its siblings, rather than moving --ml-warn, which 39 console
       literals already equal. */
    --ml-warn-soft:      #FDF6EA;
    --ml-bad-soft:       #F9E9E5;

    /* Kept so the legacy --ledger/--accent aliases still resolve. Points at the
       ACTION colour: those aliases are overwhelmingly used for buttons, links and
       focus rings. The genuinely semantic call sites were moved to --ml-good. */
    --ml-brand:          var(--ml-action);
    --ml-brand-light:    #404040;
    --ml-brand-soft:     var(--ml-action-soft);
    --ml-brand-line:     var(--ml-action-line);

    /* --- shape -----------------------------------------------------------
       The reference uses 18px interactive / 24px containers. Dialled back: a
       lender should read precise rather than soft. One number to change if it
       still feels too tight or too round. */
    --ml-radius-sm:      6px;
    --ml-radius:         12px;
    --ml-radius-lg:      16px;
    --ml-radius-pill:    999px;

    /* --- type ------------------------------------------------------------ */
    /* IBM Plex, drawn for data-dense technical and financial interfaces, so it holds
       up at the 12-16px the console actually lives at — where Geist, a geometric
       display face, closes up on a / e / s / c. Plex Sans and Plex Mono are one
       family, so the uppercase labels stop being a separate decision, and Plex has
       true tabular figures, which matters wherever money lines up in a column. */
    --ml-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    --ml-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;

    /* A deliberately SHORT scale. Every extra size is another decision a reader
       has to make; the density problem on these screens is too many competing
       sizes, not too few. Weights stop at 600 — the old 680 display weight read
       as shouting. */
    --ml-text-xs:        11px;   /* mono labels, eyebrows */
    --ml-text-sm:        12.5px; /* captions, secondary */
    --ml-text-base:      14px;   /* body */
    --ml-text-md:        16px;   /* lead, card titles */
    --ml-text-lg:        20px;   /* section headings */
    --ml-text-xl:        28px;   /* page headings */
    --ml-text-2xl:       48px;   /* display */
    --ml-display-track:  -0.05em;
    --ml-weight-normal:  400;
    --ml-weight-medium:  500;
    --ml-weight-bold:    600;
    --ml-leading-tight:  1.2;
    --ml-leading:        1.55;

    /* --- spacing: a 4px rhythm, compact ---------------------------------- */
    --ml-space-1:        4px;
    --ml-space-2:        8px;    /* element gap */
    --ml-space-3:        12px;
    --ml-space-4:        16px;
    --ml-space-5:        20px;   /* card padding */
    --ml-space-6:        32px;
    --ml-space-7:        48px;   /* section gap */
    --ml-space-8:        80px;
  }
  /* ML-TOKENS:END */

  /* Legacy names. Every one resolves to a canonical token above, so no markup
     changed — but new work should use --ml-* directly and these should shrink. */
  :root {
    --bone: var(--ml-surface);          --bone2: var(--ml-surface-alt);   --paper: var(--ml-surface-sunk);
    --ink: var(--ml-text);              --inkSoft: var(--ml-text-soft);
    --stone1: var(--ml-text-muted);     --stone2: var(--ml-text-faint);   --stone3: var(--ml-line-strong);
    --ledger: var(--ml-brand);          --ledgerSoft: var(--ml-brand-light); --clay: var(--ml-brand);
    --good: var(--ml-good);             --bad: var(--ml-bad);             --amber: var(--ml-warn);
    --goodSoft: var(--ml-good-soft);    --amberSoft: var(--ml-warn-soft);  --redSoft: var(--ml-bad-soft);
    --line: var(--ml-line);             --lineS: var(--ml-line-soft);
    --accentSoft: var(--ml-brand-soft); --accentLine: var(--ml-brand-line); --radius: var(--ml-radius);
    --serif: var(--ml-sans);            --sans: var(--ml-sans);           --mono: var(--ml-mono);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bone); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; min-height: 100%; overflow-x: hidden; }
  a { color: inherit; }
  .mono { font-family: var(--mono); }

  .shell { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 32px; border-bottom: 1px solid var(--line); background: var(--bone);
    position: sticky; top: 0; z-index: 20;
  }
  .logo { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-size: 22px; font-weight: 680; letter-spacing: -0.01em; }
  .logo em { font-style: normal; color: var(--ml-mark); }
  .topbar .right { display: flex; align-items: center; gap: 16px; }
  .mode-pill {
    font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
    padding: 6px 10px; border: 1px solid var(--line); color: var(--stone1); border-radius: 999px; white-space: nowrap;
  }
  .mode-pill.live { color: var(--ledger); border-color: var(--ledger); }
  .secure { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--stone1); display: flex; align-items: center; gap: 7px; }
  .secure svg { display: block; }
  /* currency toggle */
  .curtoggle { display: inline-flex; background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .curtoggle button { border: none; background: transparent; font-family: var(--sans); font-size: 13px; font-weight: 600; color: var(--stone1); width: 30px; height: 26px; border-radius: 999px; cursor: pointer; transition: all 0.12s; }
  .curtoggle button.on { background: var(--ink); color: #fff; }

  .stage { display: grid; place-items: start center; padding: 56px 24px 80px; }
  .card { width: 100%; max-width: 680px; }

  .stepper { display: flex; gap: 8px; margin-bottom: 38px; }
  .stepper .st { flex: 1; }
  .stepper .st .bar { height: 3px; background: var(--stone3); border-radius: 999px; }
  .stepper .st.done .bar, .stepper .st.on .bar { background: var(--ledger); }
  .stepper .st .lbl { font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--stone1); margin-top: 10px; }
  .stepper .st.on .lbl, .stepper .st.done .lbl { color: var(--ink); }
  /* --- progress bar --- */
  .progwrap { margin-bottom: 16px; }
  .progtop { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; gap: 12px; }
  .progstep { font-family: var(--mono); font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink); }
  .progpct { font-family: var(--mono); font-size: 10px; letter-spacing: 0.06em; color: var(--ledger); white-space: nowrap; }
  .progtrack { height: 7px; background: var(--bone2); border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .progfill { height: 100%; background: linear-gradient(90deg, var(--ledgerSoft), var(--ledger)); border-radius: 999px; transition: width 0.5s cubic-bezier(0.4,0,0.2,1); }
  /* --- industry taxonomy selects --- */
  .field select.tsel { width: 100%; padding: 13px 36px 13px 15px; font-family: var(--sans); font-size: 14.5px; color: var(--ink); background-color: var(--paper); border: 1px solid var(--line); border-radius: 12px; outline: none; transition: border-color 0.12s; appearance: none; -webkit-appearance: none; cursor: pointer; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8' fill='none'><path d='M1 1l5 5 5-5' stroke='%237C8A83' stroke-width='1.5'/></svg>"); background-repeat: no-repeat; background-position: right 14px center; }
  .field select.tsel:focus { border-color: var(--ledger); }
  .field select.tsel:disabled { opacity: 0.55; cursor: not-allowed; }

  .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--stone1); }
  h1.title { font-family: var(--serif); font-weight: 680; font-size: 44px; letter-spacing: -0.02em; line-height: 1.04; margin: 14px 0 14px; }
  h1.title em { font-style: normal; color: var(--ledger); }
  p.lead { font-size: 15px; line-height: 1.6; color: var(--inkSoft); max-width: 560px; }

  .field { margin-top: 28px; }
  .field > label { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--stone1); margin-bottom: 11px; }
  .field input[type=text], .field input[type=email], .field input[type=url] {
    width: 100%; padding: 14px 16px; font-family: var(--sans); font-size: 15px; color: var(--ink);
    background: var(--paper); border: 1px solid var(--line); border-radius: 12px; outline: none; transition: border-color 0.12s;
  }
  .field input:focus { border-color: var(--ledger); }
  .field .hint { font-size: 12px; color: var(--stone1); margin-top: 8px; line-height: 1.5; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  .grid2 .field { margin-top: 28px; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } }

  .optgrid { display: flex; flex-wrap: wrap; gap: 8px; }
  .opt {
    font-family: var(--sans); font-size: 14px; font-weight: 500; color: var(--ink);
    padding: 11px 16px; border-radius: 999px; background: var(--paper);
    border: 1px solid var(--line); cursor: pointer; transition: all 0.12s; line-height: 1;
  }
  .opt:hover { border-color: var(--accentLine); }
  .opt.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  .btn {
    display: inline-flex; align-items: center; gap: 8px; cursor: pointer; border: none;
    font-family: var(--sans); font-size: 15px; font-weight: 560; letter-spacing: -0.01em;
    padding: 13px 22px; border-radius: 999px; background: var(--ink); color: #fff; transition: transform 0.14s, box-shadow 0.14s;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 12px 26px -14px rgba(16,35,26,.5); }
  .btn[disabled] { opacity: 0.35; cursor: not-allowed; }
  .btn:hover[disabled] { transform: none; box-shadow: none; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .btn.green { background: var(--ledger); }
  .actions { margin-top: 40px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .actions.solo { justify-content: flex-end; }

  .reassure { margin-top: 22px; padding: 14px 18px; background: var(--accentSoft); border: 1px solid var(--accentLine); border-radius: 12px; font-size: 12.5px; line-height: 1.6; color: var(--inkSoft); }
  .reassure b { font-weight: 600; }

  .consent { margin-top: 28px; display: flex; gap: 12px; align-items: flex-start; padding: 18px; background: var(--bone2); border: 1px solid var(--line); border-radius: 12px; }
  .consent input { margin-top: 3px; width: 16px; height: 16px; accent-color: var(--ledger); flex: none; }
  .consent label { font-size: 12.5px; line-height: 1.6; color: var(--inkSoft); }
  .consent a { color: var(--ledger); }

  .err { margin-top: 18px; padding: 14px 16px; background: rgba(177,68,49,0.08); border: 1px solid rgba(177,68,49,0.3); border-radius: 10px; color: var(--bad); font-size: 13px; }

  /* ---- verdict / conversion screen (Phase 4) ---- */
  .vbadge { display: inline-flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 11px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; padding: 8px 14px; border-radius: 999px; border: 1px solid; }
  .ragdot { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; }
  .r-green  { color: var(--good); border-color: var(--accentLine); background: var(--goodSoft); }
  .r-amber  { color: var(--amber); border-color: #EBD9B4; background: var(--amberSoft); }
  .r-red    { color: var(--bad); border-color: #EAC9C1; background: var(--redSoft); }
  .ragdot.r-green { background: var(--good); }
  .ragdot.r-amber { background: var(--amber); }
  .ragdot.r-red   { background: var(--bad); }

  .vsize { font-family: var(--mono); font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--stone1); margin-top: 8px; }

  .emailed { margin-top: 22px; display: flex; align-items: center; gap: 10px; padding: 13px 16px; background: var(--goodSoft); border: 1px solid var(--accentLine); border-radius: 12px; font-size: 13px; color: var(--inkSoft); }
  .emailed svg { flex: none; }
  .emailed b { color: var(--ink); font-weight: 600; }

  .kpihead { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--stone1); margin: 30px 0 4px; }
  .pillars { border-top: 1px solid var(--line); }
  .prow { display: grid; grid-template-columns: 14px 1fr auto; gap: 14px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--lineS); }
  .prow .plabel { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
  .prow .preason { font-size: 13px; color: var(--inkSoft); line-height: 1.5; margin-top: 3px; }
  .ptag { font-family: var(--mono); font-size: 9px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; padding: 5px 10px; border-radius: 999px; border: 1px solid; }
  .withheldnote { font-size: 12.5px; color: var(--stone1); margin-top: 14px; line-height: 1.6; }

  .facbox { margin-top: 28px; background: var(--goodSoft); border: 1px solid var(--accentLine); border-radius: 16px; padding: 24px; }
  .faclabel { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ledger); }
  .facrange { font-family: var(--serif); font-size: 40px; font-weight: 680; letter-spacing: -0.03em; margin: 8px 0 6px; }
  .faccav { font-size: 12px; color: var(--inkSoft); line-height: 1.5; }

  .hookhead { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--stone1); margin: 30px 0 10px; }
  .hooks { display: flex; flex-direction: column; gap: 10px; }
  .hook { display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: start; padding: 14px 16px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; }
  .hooklock { margin-top: 2px; }
  .hookt { font-size: 14px; font-weight: 600; }
  .hookd { font-size: 12.5px; color: var(--stone1); line-height: 1.55; margin-top: 3px; }

  .ctaband { margin-top: 28px; background: var(--ink); color: #fff; border-radius: 18px; padding: 30px; text-align: center; }
  .ctaband .ctacopy { font-size: 15px; line-height: 1.6; color: rgba(255,255,255,0.86); max-width: 48ch; margin: 0 auto 22px; }
  .ctaband .btn.green { background: var(--ledger); }
  .ctadisc { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 16px; line-height: 1.5; max-width: 50ch; margin-left: auto; margin-right: auto; }

  .caveat { margin-top: 22px; font-size: 12px; line-height: 1.6; color: var(--stone1); }

  .footer { padding: 24px 32px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--stone1); }
  .footer a { color: var(--stone1); }
  .footer a:hover { color: var(--ink); }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bone); padding: 14px 22px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em;
    opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 50;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 680px) {
    h1.title { font-size: 34px; }
    .facrange { font-size: 32px; }
    .stage { padding: 36px 18px 60px; }
    .topbar { padding: 14px 16px; gap: 10px; }
    .topbar .secure { display: none; }
    .topbar .mode-pill { display: none; }     /* free the crowded top bar; keep the currency toggle */
    .stepper .st .lbl { font-size: 8px; }
    .opt { padding: 14px 16px; }               /* ~44px finger targets */
    .ctaband { padding: 22px; }
    .ctaband .btn { max-width: 100%; white-space: normal; }
  }
  /* --- NEW funding step (sandbox) --- */
  .amountfield { display: flex; align-items: center; gap: 2px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 0 14px; transition: border-color 0.12s; }
  .amountfield:focus-within { border-color: var(--ledger); }
  .amountfield .amtsym { font-size: 17px; color: var(--inkSoft); }
  .amountfield input { border: none; background: transparent; outline: none; font-size: 17px; padding: 14px 8px; width: 100%; font-variant-numeric: tabular-nums; color: var(--ink); }
  .prodcards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 560px) { .prodcards { grid-template-columns: 1fr; } }
  .selcard { position: relative; text-align: left; padding: 14px 14px 13px; border-radius: 13px; background: var(--paper); border: 1.5px solid var(--line); cursor: pointer; transition: all 0.13s; display: flex; flex-direction: column; gap: 3px; }
  .selcard:hover { border-color: var(--accentLine); transform: translateY(-1px); }
  .selcard.on { border-color: var(--ledger); background: var(--goodSoft); }
  .selcard .pt { font-size: 14px; font-weight: 600; line-height: 1.25; }
  .selcard .pk { font-family: var(--mono); font-size: 10px; color: var(--stone1); letter-spacing: 0.03em; }
  .selcard .tick { position: absolute; top: 11px; right: 11px; width: 19px; height: 19px; border-radius: 50%; border: 1.5px solid var(--stone3); display: grid; place-items: center; color: #fff; font-size: 11px; }
  .selcard.on .tick { background: var(--ledger); border-color: var(--ledger); }
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="logo">
      <svg width="22" height="19" viewBox="0 0 280 240" fill="none">
        <line x1="20" y1="220" x2="260" y2="220" stroke="var(--ink)" stroke-width="8" />
        <rect x="40" y="150" width="48" height="70" fill="var(--ink)" />
        <rect x="116" y="100" width="48" height="120" fill="var(--ink)" />
        <rect x="192" y="40" width="48" height="180" fill="var(--ml-mark)" />
      </svg>
      Margin<em>Labs.</em>
    </div>
    <div class="right">
      <span class="secure">
        <svg width="11" height="13" viewBox="0 0 11 13" fill="none"><rect x="1" y="5.5" width="9" height="6.5" stroke="#8A8678" stroke-width="1.2"/><path d="M3 5.5V3.5a2.5 2.5 0 015 0v2" stroke="#8A8678" stroke-width="1.2"/></svg>
        Funding application · no login
      </span>
      <span class="curtoggle" id="curToggle">
        <button data-cur="GBP" class="on">£</button>
        <button data-cur="EUR">€</button>
        <button data-cur="USD">$</button>
      </span>
      <span class="mode-pill" id="modePill">Demo mode</span>
    </div>
  </div>

  <div class="stage">
    <div class="card" id="app"><!-- rendered by JS --></div>
  </div>

  <div class="footer">

const MID_CASH = {'<£10k':5000,'£10–50k':30000,'£50–150k':100000,'£150–500k':325000,'£500k+':750000};
const MID_DEBT = {'<£1k':500,'£1–5k':3000,'£5–15k':10000,'£15–50k':32500,'£50k+':75000};
const IDX_12M  = {'<£100k':0,'£100–500k':1,'£500k–1M':2,'£1–3M':3,'£3–5M':4,'£5M+':5};
// x4: <£20k->under £80k (class 0); £20–30k->£80–120k and £30–100k->£120–400k
// both land in the £100–500k class (1). Sharing a class is correct here — the

const ANN_3M   = {'<£20k':0,'£20–30k':1,'£30–100k':1,'£100–250k':2,'£250–500k':3,'£500k–1M':4,'£1M+':5};

/* ============================ SCORING ENGINE v2 ============================ */
const PILLAR_WEIGHT = { cash:25, serv:25, margin:20, debt:15, growth:7, conc:4, track:4 };
const STATES = ['Fundable Now', 'Fundable in 3–6 months', 'Fundable in 6+ months'];
const RAGS   = ['Green', 'Amber', 'Red'];
const VERDICTS = [
  // Fundable Now
  "On what you've told us, you're in fundable shape now — and not because you're big. What lenders actually underwrite is here: a real cash cushion, margins that can carry repayments, and either no existing debt or debt you're comfortably servicing. The job from here isn't whether you can raise — it's making sure you take the right facility at the right price, not the first one offered.",
  // Fundable in 3–6 months
  "You've got real foundations, and you're close. One or two of the things lenders lean on hardest — your cash buffer, how much existing finance you're carrying, or your margin headroom — would want firming up before a clean yes at the size you're after. They're specific and fixable: the kind of thing the next three to six months can move. You're nearly there, and now you know exactly where to aim.",
  // Fundable in 6+ months  (redline applied: ends at "brings the runway in.")
  "You're fundable — on a longer runway than the brands a lender says yes to today, and that's a normal place to be, not a knock-back. It isn't about your size; it's that one or more of the fundamentals lenders rely on — a cash cushion, room to service debt, healthy margins, or not being stretched across too many existing facilities — isn't in place yet. Each one is something you can build deliberately, in a sensible order. Over the months ahead, the highest-value move isn't borrowing — it's strengthening those fundamentals first. That's exactly what brings the runway in.",
];

function ragOf(pts) { return pts >= 70 ? 'Green' : pts >= 40 ? 'Amber' : 'Red'; }
function ptsOf(rag) { return rag === 'Green' ? 100 : rag === 'Amber' ? 50 : 0; }

function roundClean(x, dir) {
  const step = x < 100000 ? 5000 : x < 500000 ? 10000 : x < 1000000 ? 25000 : 100000;
  return dir === 'down' ? Math.floor(x / step) * step : Math.ceil(x / step) * step;
}

function scoreTriage(a) {
  // ---- normalised monthly revenue (conservative blend) ----
  const recent   = MID_3M[a.revenue_3m_band] / 3;
  const trailing = MID_12M[a.revenue_band] / 12;
  const ratio = recent / trailing;
  const within30 = ratio >= 0.7 && ratio <= 1.3;
  const norm = within30 ? (recent + trailing) / 2 : Math.min(recent, trailing);
  const trailingAnnual = MID_12M[a.revenue_band];

  // ---- trajectory (annualised 3-month vs 12-month) → Growth ----
  const traj = ANN_3M[a.revenue_3m_band] - IDX_12M[a.revenue_band];
  const trajLabel = traj >= 1 ? 'Accelerating' : traj === 0 ? 'Steady' : traj === -1 ? 'Softening' : 'Sharply slowing';
  const trajPts = traj >= 1 ? 1 : traj === 0 ? 0 : traj === -1 ? -1 : -2;

  // ---- CASH (25) : cash relative to monthly revenue ----
  let cash;
  if (a.cash_band === 'Prefer not to say') {
    cash = { rag:'Amber', reason:'Cash position not shared — we’ve treated it cautiously.' };
  } else {
    const mid = MID_CASH[a.cash_band];
    const months = mid / norm;
    let rag = months >= 3 ? 'Green' : months >= 1 ? 'Amber' : 'Red';
    if (mid < 10000 && rag === 'Green') rag = 'Amber';  // absolute-thinness guard
    cash = { rag, reason:
      rag === 'Green' ? 'A solid cash cushion relative to your monthly turnover.' :
      rag === 'Amber' ? 'A workable cash buffer, but thinner than lenders prefer.' :
                        'Cash buffer is thin against your monthly outgoings.' };
  }

  // ---- SERVICEABILITY (25) : debt repayment ÷ monthly revenue ----
  let serv;
  if (a.has_debt !== true) {
    serv = { rag:'Green', reason:'No existing debt to service — full headroom for new finance.' };
  } else if (a.debt_monthly_band === 'Prefer not to say') {
    serv = { rag:'Amber', reason:'Repayment level not shared — treated cautiously.' };
  } else {
    const r = MID_DEBT[a.debt_monthly_band] / norm;
    const pct = Math.round(r * 100) + '%';
    const rag = r <= 0.15 ? 'Green' : r <= 0.25 ? 'Amber' : 'Red';
    serv = { rag, reason:
      rag === 'Green' ? `Existing repayments are about ${pct} of revenue — comfortable headroom.` :
      rag === 'Amber' ? `Existing repayments are about ${pct} of revenue — limited room for more.` :
                        `Existing repayments are about ${pct} of revenue — already a heavy load.` };
  }

  // ---- MARGIN (20) ----
  let margin, marginNotSure = false;
  const g = a.gross_margin_band;
  if (g === '70%+' || g === '50–70%')      margin = { rag:'Green', reason:'Healthy gross margin — room to carry repayments.' };
  else if (g === '30–50%')                 margin = { rag:'Amber', reason:'Workable margin, with limited room to service new debt.' };
  else if (g === '<30%')                   margin = { rag:'Red',   reason:'Thin margin makes affordable debt-service hard to evidence.' };
  else { marginNotSure = true;             margin = { rag:'Amber', reason:'Margin not yet known — worth pinning down; treated neutrally.' }; }

  // ---- DEBT LOAD (15) : none is best; stacking caps ----
  let debt, capMiddle = false, debtPts;
  if (a.has_debt !== true) { debt = { rag:'Green', reason:'No external debt — maximum headroom.' }; debtPts = 100; }
  else if (a.debt_providers === '1') { debt = { rag:'Green', reason:'A single facility — a normal, healthy debt position.' }; debtPts = 85; }
  else if (a.debt_providers === '2') { debt = { rag:'Amber', reason:'Two facilities running — manageable, but a watch-item.' }; debtPts = 50; }
  else if (a.debt_providers === '3') { debt = { rag:'Amber', reason:'Three facilities running — enough to make a new lender pause.' }; debtPts = 40; capMiddle = true; }
  else if (a.debt_providers === '4+') { debt = { rag:'Red', reason:'Four or more facilities — reads as debt-stacking, a serious flag.' }; debtPts = 0; capMiddle = true; }
  else { debt = { rag:'Amber', reason:'Existing finance noted — details light.' }; debtPts = 50; }

  // ---- GROWTH (7) : direction + repeat + trajectory ----
  const dirPts = { Growing:2, Flat:0, Declining:-2 }[a.revenue_direction];
  const repPts = { 'Mostly one-time':-1, 'Some repeat':0, 'Strong repeat':1 }[a.repeat_band];
  const gs = dirPts + repPts + trajPts;
  const growth = { rag: gs >= 2 ? 'Green' : gs <= -2 ? 'Red' : 'Amber', reason:
    gs >= 2 ? 'Demand is moving the right way, with repeat revenue underpinning it.' :
    gs <= -2 ? 'Revenue is contracting — a lender will want it explained.' :
              'Growth is steady-to-mixed.' };

  // ---- CONCENTRATION (4) : SKU + markets ----
  const skuPts = { 'Broad range':1, 'A handful':0, 'One hero product':-1 }[a.sku_concentration];
  const mkPts  = { '4+':1, '2–3':0, '1':-1 }[a.markets_count];
  const cs = skuPts + mkPts;
  const conc = { rag: cs >= 1 ? 'Green' : cs <= -2 ? 'Red' : 'Amber', reason:
    cs >= 1 ? 'Revenue spread across products and markets.' :
    cs <= -2 ? 'Heavily reliant on one product in one market.' :
              'Some product or market concentration to watch.' };

  // ---- TRACK & SYSTEMS (4) : years + systems + not-sure margin ----
  const yrPts = { '4+':2, '2–4':1, '1–2':-1, '<1':-3 }[a.years_trading_band];
  const shPts = a.uses_shopify === true ? 1 : 0;
  const acPts = (['Xero','QuickBooks','Sage'].includes(a.accounting_system)) ? 1 : (a.accounting_system === 'None / spreadsheets' ? -2 : 0);
  const ts = yrPts + shPts + acPts + (marginNotSure ? -1 : 0);
  const track = { rag: ts >= 3 ? 'Green' : ts >= 1 ? 'Amber' : 'Red', reason:
    ts >= 3 ? 'Established trading history with clean, verifiable systems.' :
    ts >= 1 ? 'Foundations forming — history or systems still maturing.' :
             'Limited history or hard-to-verify books.' };

  // ---- assemble pillars + weighted score ----
  const defs = [
    ['cash','Cash buffer',cash], ['serv','Serviceability',serv], ['margin','Margin',margin],
    ['debt','Debt load',debt], ['growth','Growth',growth], ['conc','Concentration',conc], ['track','Track & systems',track],
  ];
  const pillars = defs.map(([key,label,p]) => {
    const pts = key === 'debt' ? debtPts : ptsOf(p.rag);
    return { key, label, rag:p.rag, reason:p.reason, pts, weight:PILLAR_WEIGHT[key] };
  });
  const score = pillars.reduce((s,p) => s + p.pts * p.weight, 0) / 100;

  // ---- roll-up → state index ----
  const heavy = pillars.filter(p => ['cash','serv','margin','debt'].includes(p.key));
  const heavyReds = heavy.filter(p => p.rag === 'Red').length;
  const cashRed = cash.rag === 'Red', servRed = serv.rag === 'Red';
  let idx;
  if (trailingAnnual < 10000) idx = 2;                                  // residual ~£10k floor
  else if (heavyReds >= 2 || (cashRed && servRed) || score < 45) idx = 2;
  else if (heavyReds === 0 && score >= 65) idx = 0;
  else idx = 1;
  // caps (downgrade only)
  if (capMiddle) idx = Math.max(idx, 1);                                // 3+ providers hold at middle
  const thinCash = (a.cash_band === '<£10k' || a.cash_band === '£10–50k');
  if (a.revenue_direction === 'Declining' && thinCash) idx = Math.min(idx + 1, 2);

  // ---- facility sizing (suppressed on 6+) ----
  const multLow = trailingAnnual >= 500000 ? 2 : 1.5;
  const multHigh = trailingAnnual >= 500000 ? 3 : 2;
  let facility_low = null, facility_high = null;
  if (idx < 2) { facility_low = roundClean(norm * multLow, 'down'); facility_high = roundClean(norm * multHigh, 'up'); }

  // ---- size descriptor (descriptive only; never gates) ----
  const size_descriptor = trailingAnnual < 250000 ? 'Early-stage' : trailingAnnual < 1000000 ? 'Established' : trailingAnnual < 5000000 ? 'Scaled' : 'Large';

  // ---- top 3 most decisive pillars ----
  const top3 = pillars.slice().sort((x,y) => Math.abs(y.pts - 50) * y.weight - Math.abs(x.pts - 50) * x.weight).slice(0, 3);

  return {
    rag_overall: RAGS[idx],
    fundability_state: STATES[idx],
    verdict_summary: VERDICTS[idx],
    idx, score, size_descriptor, facility_low, facility_high,
    norm, recent, trailing, trailingAnnual, trajectory: trajLabel, multiple: [multLow, multHigh],
    pillars, top3keys: top3.map(p => p.key),
  };
}

function render() {

  wire();

/* ---------------- wiring ---------------- */
function wire() {
  document.querySelectorAll('.opt').forEach(b => {
    b.onclick = () => {
      const key = b.dataset.key;
      let val = b.dataset.val;
      if (b.dataset.type === 'bool') val = (val === 'true');
      state.answers[key] = val;
      state.error = '';
      b.closest('.optgrid').querySelectorAll('.opt').forEach(x => x.classList.toggle('on', x === b));
      // Country decides which fields are even askable, so the step must redraw.
      // A state left over from a changed answer would be sent for a UK company.
      if (key === 'country_of_registration' && val !== 'US') state.answers.us_state = null;
      if (key === 'has_debt' || key === 'country_of_registration') render();
    };
  });

  const uss = document.getElementById('usstate');
  if (uss) uss.onchange = () => { state.answers.us_state = uss.value || null; state.error = ''; };

  const il1 = document.getElementById('ind_l1');
  if (il1) il1.onchange = () => {
    const e = TAXO.find(x => x[1] === il1.value);
    state.answers.industry_l1 = il1.value || null;
    state.answers.industry_l1_id = e ? e[0] : null;
    state.answers.industry_l2 = null; state.answers.industry_l2_id = null;
    state.error = ''; render();
  };
  const il2 = document.getElementById('ind_l2');
  if (il2) il2.onchange = () => {
    const o = il2.options[il2.selectedIndex];
    state.answers.industry_l2 = il2.value || null;
    state.answers.industry_l2_id = (o && o.dataset.id) ? Number(o.dataset.id) : null;
    state.error = '';
  };

  const next = document.getElementById('next');
  const back = document.getElementById('back');
  const submit = document.getElementById('submit');

  if (back) back.onclick = () => { state.error = ''; state.step--; render(); };
  if (state.step === 0 && next) next.onclick = () => { state.step = 1; render(); };

  if (state.step === 1) {                 // You (contact) — now the first section
    const cb = document.getElementById('consent');
    if (cb) cb.onchange = () => { state.answers.consent = cb.checked; const n = document.getElementById('next'); if (n) n.disabled = !cb.checked; };
    ['first','last','email','legal','cnum','web'].forEach(id => { const e = document.getElementById(id); if (e) e.oninput = syncContactInputs; });
    if (next) next.onclick = () => {
      syncContactInputs();
      const a = state.answers;
      if (!a.first_name || !a.last_name) { state.error = 'Please add your first and last name.'; return render(); }
      if (!a.email || !a.email.includes('@')) { state.error = 'Please enter a valid email so we can send your next step.'; return render(); }
      if (!a.legal_entity_name) { state.error = 'Please add the business / legal entity name.'; return render(); }
      if (!a.website_url) { state.error = 'Please add your website.'; return render(); }
      if (!answered('funding_intent')) { state.error = "Let us know what you're hoping to do."; return render(); }
      if (!a.consent) { state.error = "Please tick the box to confirm you're authorised and accept the terms."; return render(); }
      state.error = ''; state.step++; render();
    };
  }
  if (next && state.step >= 2 && state.step <= 5) {   // Business · Scale · Growth · Position
    next.onclick = () => {
      const missing = requiredFor(state.step).find(k => !answered(k));
      if (missing) { state.error = 'Just need one more — please pick an option for every question above.'; return render(); }
      state.error = ''; state.step++; render();
    };
  }
  if (state.step === 6) {                 // Funding need — now the final section, submits
    document.querySelectorAll('[data-multi]').forEach(b => b.onclick = () => {
      const key = b.dataset.multi, v = b.dataset.val;
      let arr = Array.isArray(state.answers[key]) ? state.answers[key].slice() : [];
      if (v === 'not_sure') arr = arr.includes('not_sure') ? [] : ['not_sure'];
      else { arr = arr.filter(x => x !== 'not_sure'); arr = arr.includes(v) ? arr.filter(x => x !== v) : arr.concat(v); }
      state.answers[key] = arr; state.error = ''; render();
    });
    const amt = document.getElementById('fundamt');
    if (amt) amt.oninput = () => { const raw = amt.value.replace(/[^0-9]/g, ''); state.answers.funding_amount = raw ? Number(raw) : ''; amt.value = raw ? Number(raw).toLocaleString() : ''; };
    if (submit) submit.onclick = () => {
      const a = state.answers;
      if (!(Number(a.funding_amount) > 0)) { state.error = 'Please enter how much funding you need.'; return render(); }
      if (!answered('ideal_payback')) { state.error = 'Please choose an ideal payback period.'; return render(); }
      if (!Array.isArray(a.product_preference) || !a.product_preference.length) { state.error = 'Please select at least one product (or “Not sure”).'; return render(); }
      if (!answered('use_of_funds')) { state.error = 'Please choose what the funds are for.'; return render(); }
      doSubmit();
    };
  }
}
function requiredFor(step) {
  switch (step) {
    case 2: return ['business_type', 'industry_l1', 'years_trading_band', 'markets_count', 'uses_shopify', 'accounting_system'];
    case 3: return ['revenue_band', 'revenue_3m_band', 'aov_band', 'gross_margin_band'];
    case 4: return ['revenue_direction', 'repeat_band', 'sku_concentration'];
    case 5: return state.answers.has_debt === true
      ? ['cash_band', 'has_debt', 'debt_providers', 'debt_monthly_band']
      : ['cash_band', 'has_debt'];
    default: return [];
  }
}
function syncContactInputs() {
  if (state.step !== 1) return;
  const map = { first:'first_name', last:'last_name', email:'email', legal:'legal_entity_name', cnum:'company_number', web:'website_url' };
  Object.entries(map).forEach(([id, key]) => { const e = document.getElementById(id); if (e) state.answers[key] = e.value.trim(); });
}

/* ---------------- submit ---------------- */
async function doSubmit() {
  const a = state.answers;
  // contact + consent were captured on the You step (now the first section); send back there if anything's missing
  if (!a.first_name || !a.last_name) { state.error = 'Please add your first and last name.'; state.step = 1; return render(); }
  if (!a.email || !a.email.includes('@')) { state.error = 'Please enter a valid email so we can send your next step.'; state.step = 1; return render(); }
  if (!a.legal_entity_name) { state.error = 'Please add the business / legal entity name.'; state.step = 1; return render(); }
  if (!a.website_url) { state.error = 'Please add your website.'; state.step = 1; return render(); }
  if (!answered('funding_intent')) { state.error = "Let us know what you're hoping to do."; state.step = 1; return render(); }
  if (!a.consent) { state.error = "Please tick the box to confirm you're authorised and accept the terms."; state.step = 1; return render(); }

  const submit = document.getElementById('submit');
  submit.disabled = true; submit.textContent = 'Scoring…';

  // ---- compute the verdict BEFORE the insert ----
  const result = scoreTriage(a);
  state.result = result;
  state.ref = 'ML-' + uid().toUpperCase();

  // money bands stored with the chosen currency symbol (numbers unchanged)
  const money = k => (a[k] ? disp(a[k]) : a[k]);

  const pillar_scores = {
    ref: state.ref,
    score: Math.round(result.score),
    currency: state.currency,
    normalised_monthly: Math.round(result.norm),
    recent_monthly: Math.round(result.recent),
    trailing_monthly: Math.round(result.trailing),
    trailing_annual: result.trailingAnnual,
    trajectory: result.trajectory,
    multiple: result.multiple,
    facility: result.facility_low != null ? { low: result.facility_low, high: result.facility_high } : null,
    size_descriptor: result.size_descriptor,
    top3: result.top3keys,
    pillars: result.pillars.map(p => ({ key:p.key, label:p.label, rag:p.rag, pts:p.pts, weight:p.weight, reason:p.reason })),
  };

  const row = {
    email: a.email, first_name: a.first_name, last_name: a.last_name,
    legal_entity_name: a.legal_entity_name, company_number: a.company_number || null, website_url: a.website_url,
    country_of_registration: a.country_of_registration || null,
    us_state: (a.country_of_registration === 'US' && a.us_state) ? a.us_state : null,
    revenue_band: money('revenue_band'), revenue_3m_band: money('revenue_3m_band'), aov_band: money('aov_band'),
    business_type: a.business_type, gross_margin_band: a.gross_margin_band,
    revenue_direction: a.revenue_direction, repeat_band: a.repeat_band,
    sku_concentration: a.sku_concentration, markets_count: a.markets_count,
    cash_band: money('cash_band'),
    has_debt: a.has_debt,
    debt_providers: a.has_debt ? (a.debt_providers || null) : null,
    debt_monthly_band: a.has_debt ? money('debt_monthly_band') : null,
    years_trading_band: a.years_trading_band, uses_shopify: a.uses_shopify, accounting_system: a.accounting_system,
    funding_intent: a.funding_intent,
    industry_l1: a.industry_l1 || null,
    industry_l2: a.industry_l2 || null,
    industry_taxonomy_id: (a.industry_l2_id != null ? a.industry_l2_id : (a.industry_l1_id != null ? a.industry_l1_id : null)),
    // NEW · Phase-1 routing fields (sandbox). triage-table columns to be added on approval.
    funding_amount: (a.funding_amount != null && a.funding_amount !== '') ? Number(a.funding_amount) : null,
    funding_currency: state.currency,
    ideal_payback: a.ideal_payback || null,
    product_preference: Array.isArray(a.product_preference) ? a.product_preference : [],
    use_of_funds: a.use_of_funds || null,
    consent_authorised: true, accepted_terms_at: new Date().toISOString(),
    // computed verdict (v2)
    rag_overall: result.rag_overall,
    fundability_state: result.fundability_state,
    verdict_summary: result.verdict_summary,
    pillar_scores,
    facility_low: result.facility_low,
    facility_high: result.facility_high,
    size_descriptor: result.size_descriptor,
    currency: state.currency,
  };

  if (!LIVE) { await new Promise(r => setTimeout(r, 400)); state.step = 7; render(); return; }

  try {
    await loadSDK();
    const client = ensureClient();
    if (!client) { state.error = 'Secure connection is still loading — give it a second and try again.'; submit.textContent = 'Submit my application →'; submit.disabled = false; return render(); }
    // No .select() — anon has INSERT but no READ on triage.
    const { error } = await client.from('triage').insert(row);
    if (error) throw error;
    state.step = 7; render();
  } catch (e) {
    state.error = 'Something went wrong submitting that: ' + (e.message || e) + '. Your answers are still here — please try again.';
    submit.textContent = 'Submit my application →'; submit.disabled = false; render();
  }
}

/* ---------------- boot ---------------- */
render();

// currency toggle (always visible in the topbar)
document.querySelectorAll('#curToggle button').forEach(b => {
  b.onclick = () => {
    syncContactInputs();
    state.currency = b.dataset.cur;
    document.querySelectorAll('#curToggle button').forEach(x => x.classList.toggle('on', x === b));
    render();
  };
});

// webfonts after first paint
(function loadFonts() {
  var l = document.createElement('link');
  l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap';
  document.head.appendChild(l);
})();
</script>
</body>
</html>
